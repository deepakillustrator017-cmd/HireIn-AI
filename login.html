<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6C3EF4">
  <title>Sign In | HireIn AI</title>
  <link rel="stylesheet" href="assets/css/hirein-app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/supabase-client.js"></script>
  <script defer src="assets/js/auth.js"></script>
</head>
<body>
<header class="site-header"><div class="site-header-inner">
  <a class="site-brand" href="index.html">HireIn AI</a>
  <nav class="site-menu" aria-label="Main navigation"><a href="index.html">Home</a><a href="job-grid.html">Jobs</a><a href="ats.html">AI Resume</a><a href="dashboard.html">Dashboard</a><a href="admin.html">Recruiters</a></nav>
  <a class="site-signin" href="signup.html">Create account</a>
</div></header>
<main class="auth-layout">
  <section class="auth-card">
    <h1>Welcome back</h1><p>Sign in to manage applications and your resume.</p>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Sign In</button>
    </form>
    <p id="authMessage" class="notice" role="status" aria-live="polite"></p>
    <div class="auth-links"><a href="signup.html">Create an account</a><a href="job-grid.html">Browse jobs</a></div>
  </section>
</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#6C3EF4">
  <meta name="description" content="Create, improve and download an ATS-friendly resume with HireIn AI.">
  <title>AI Resume Builder | HireIn AI</title>
  <link rel="stylesheet" href="assets/css/hirein-app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <script defer src="assets/js/supabase-client.js"></script><script defer src="assets/js/ai-service.js"></script><script defer src="assets/js/resume-builder.js"></script>
</head>
<body>
<header class="site-header"><div class="site-header-inner"><a class="site-brand" href="/">HireIn AI</a><nav class="site-menu" aria-label="Main navigation"><a href="/">Home</a><a href="/jobs">Jobs</a><a href="/resume-ai.html" aria-current="page">AI Resume</a><a href="/dashboard">Dashboard</a><a href="/recruiter">Recruiter</a></nav><a class="site-signin" href="/login">Login</a></div></header>
<main class="page-shell resume-builder-page">
  <section class="page-heading"><div><h1>AI Resume Builder</h1><p>Create an ATS-friendly resume, improve your writing, and save a print-ready PDF to your dashboard.</p></div></section>
  <p id="resumeMessage" class="notice" role="status" aria-live="polite"></p>
  <div class="resume-builder-layout">
    <section class="panel resume-editor" aria-labelledby="resumeEditorHeading">
      <h2 id="resumeEditorHeading">Your details</h2>
      <form id="resumeForm">
        <div class="field"><label for="resumeName">Resume name</label><input id="resumeName" name="resume_name" maxlength="120" value="My HireIn AI resume" required></div>
        <div class="field"><label for="resumeTemplate">Template</label><select id="resumeTemplate" name="template"><option value="modern">Modern</option><option value="minimal">Minimal</option><option value="executive">Executive</option><option value="creative">Creative</option></select></div>
        <section class="resume-form-section"><h3>Personal</h3><div class="form-grid">
          <div class="field"><label for="fullName">Full name</label><input id="fullName" name="full_name" autocomplete="name" required maxlength="120"></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254"></div>
          <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div>
          <div class="field"><label for="location">Location</label><input id="location" name="location" autocomplete="address-level2" maxlength="120"></div>
          <div class="field"><label for="portfolio">Portfolio</label><input id="portfolio" name="portfolio" type="url" placeholder="https://" maxlength="500"></div>
          <div class="field"><label for="linkedin">LinkedIn</label><input id="linkedin" name="linkedin" type="url" placeholder="https://linkedin.com/in/..." maxlength="500"></div>
        </div></section>
        <section class="resume-form-section"><h3>Summary</h3><div class="field"><label for="summary">Professional summary</label><textarea id="summary" name="summary" rows="5" maxlength="2500"></textarea><div class="resume-ai-actions"><button class="small-button ai-action" type="button" data-ai="generateSummary" data-target="summary">Write with AI</button><button class="small-button ai-action" type="button" data-ai="grammarCorrection" data-target="summary">Grammar correction</button><button class="small-button ai-action" type="button" data-ai="atsOptimize" data-target="summary">ATS optimize</button></div></div></section>
        <section class="resume-form-section"><div class="resume-section-heading"><h3>Experience</h3><button type="button" class="small-button secondary-button" data-add="experienceList" data-kind="experience">Add role</button></div><div id="experienceList"></div><div class="resume-ai-actions"><button type="button" class="small-button ai-action" data-ai="improveExperience" data-target="experienceList">Improve bullets with AI</button><button type="button" class="small-button ai-action" data-ai="generateAchievements" data-target="experienceList">Draft achievements</button></div></section>
        <section class="resume-form-section"><div class="resume-section-heading"><h3>Projects</h3><button type="button" class="small-button secondary-button" data-add="projectList" data-kind="project">Add project</button></div><div id="projectList"></div></section>
        <section class="resume-form-section"><div class="resume-section-heading"><h3>Education</h3><button type="button" class="small-button secondary-button" data-add="educationList" data-kind="education">Add education</button></div><div id="educationList"></div></section>
        <section class="resume-form-section"><h3>Skills</h3><div class="field"><label for="skills">Skills (separate with commas)</label><textarea id="skills" name="skills" rows="3" maxlength="1500"></textarea><button class="small-button ai-action" type="button" data-ai="suggestSkills" data-target="skills">Suggest skills with AI</button></div></section>
        <section class="resume-form-section"><div class="resume-section-heading"><h3>Certificates</h3><button type="button" class="small-button secondary-button" data-add="certificateList" data-kind="certificate">Add certificate</button></div><div id="certificateList"></div></section>
        <section class="resume-form-section"><div class="resume-section-heading"><h3>Languages</h3><button type="button" class="small-button secondary-button" data-add="languageList" data-kind="language">Add language</button></div><div id="languageList"></div></section>
        <section class="resume-form-section"><div class="resume-section-heading"><h3>Links</h3><button type="button" class="small-button secondary-button" data-add="linkList" data-kind="link">Add link</button></div><div id="linkList"></div></section>
        <div class="form-actions"><button id="downloadResume" type="button">Generate PDF & Save</button><button id="printResume" type="button" class="save-job">Print preview</button></div>
      </form>
    </section>
    <aside class="resume-preview-wrap" aria-label="Resume preview"><div class="resume-preview-label">Live preview</div><article id="resumePreview" class="resume-sheet template-modern"></article></aside>
  </div>
</main>
</body>
</html>

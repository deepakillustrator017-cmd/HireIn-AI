<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6C3EF4">
  <meta name="description" content="Explore a live job opportunity from HireIn AI.">
  <title>Job details | HireIn AI</title>
  <link rel="stylesheet" href="/assets/css/hirein-app.css">
  <script type="application/ld+json" id="jobPostingSchema">{}</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/assets/js/supabase-client.js"></script>
  <script defer src="/assets/js/job-detail.js"></script>
</head>
<body>
<header class="site-header"><div class="site-header-inner">
  <a class="site-brand" href="/">HireIn AI</a>
  <nav class="site-menu" aria-label="Main navigation"><a href="/">Home</a><a href="/jobs">Jobs</a><a href="/resume-ai.html">AI Resume</a><a href="/dashboard">Dashboard</a><a href="/recruiter">Recruiter</a></nav>
  <a class="site-signin" href="/login">Login</a>
</div></header>
<main class="page-shell">
  <nav aria-label="Breadcrumb" class="muted"><a href="/jobs">Jobs</a> / <span id="jobBreadcrumb">Job details</span></nav>
  <p id="jobMessage" class="notice" role="status" aria-live="polite">Loading job details…</p>
  <article id="jobContent" class="panel job-detail" hidden>
    <div class="job-detail-heading"><img id="jobLogo" class="job-detail-logo" alt=""><div><p id="jobCategory" class="muted"></p><h1 id="jobTitle"></h1><p id="jobCompany" class="job-company"></p></div></div>
    <div id="jobMeta" class="job-meta"></div>
    <div id="jobSalary" class="job-salary"></div>
    <div class="job-detail-actions"><a id="applyNow" class="small-button" href="#">Apply Now</a><button id="saveJob" class="save-job" type="button">Save job</button></div>
    <section class="job-detail-section"><h2>About the role</h2><div id="jobDescription" class="job-prose"></div></section>
    <section id="responsibilitiesSection" class="job-detail-section" hidden><h2>Responsibilities</h2><div id="jobResponsibilities" class="job-prose"></div></section>
    <section id="requirementsSection" class="job-detail-section" hidden><h2>Requirements</h2><div id="jobRequirements" class="job-prose"></div></section>
    <section id="skillsSection" class="job-detail-section" hidden><h2>Skills</h2><div id="jobSkills" class="job-tags"></div></section>
    <section id="benefitsSection" class="job-detail-section" hidden><h2>Benefits</h2><div id="jobBenefits" class="job-prose"></div></section>
    <section class="job-detail-section"><h2>Company</h2><p id="companyInfo" class="job-prose"></p></section>
  </article>
</main>
</body>
</html>
